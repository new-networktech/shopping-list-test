services:
  mongodb:
    image: mongo:7
    container_name: shopping-list-mongodb
    restart: unless-stopped
    ports:
      - "27888:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=${MONGODB_ROOT_PASSWORD:-"45ABB#DBD9!C42A9C78286B25BCE8FBCAB"}
      - MONGO_INITDB_DATABASE=shopping_list_auth
    networks:
      - shopping-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  backend:
    image: ${DOCKER_HUB_USERNAME}/shopping-list-backend:${IMAGE_TAG:-latest}
    container_name: shopping-list-backend
    restart: unless-stopped
    ports:
      - "8185:8185"
    volumes:
      - shopping_data:/app/data
    environment:
      - S3_BUCKET=${S3_BUCKET:-shopping-list-backup}
      - MONGODB_URL=mongodb://admin:${MONGODB_ROOT_PASSWORD:-"45ABB#DBD9!C42A9C78286B25BCE8FBCAB"}@mongodb:27017/shopping_list_auth?authSource=admin
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-09d25e094faa6ca2556c818166b7a9563b93f7099f6f0f4caa6cf63b88e8d3e7}
      - JWT_ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=1440
      - PORT=8185
      - ADMIN_USERNAME=${ADMIN_USERNAME:-mjshp}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-"125C4A$A978#D1D502041A551ED7FCA7BAEF"}
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - shopping-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8185/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    image: ${DOCKER_HUB_USERNAME}/shopping-list-frontend:${IMAGE_TAG:-latest}
    container_name: shopping-list-frontend
    restart: unless-stopped
    ports:
      - "3135:3135"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8185
      - PORT=3135
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - shopping-network
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:3135",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  shopping_data:
    driver: local
  mongo_data:
    driver: local

networks:
  shopping-network:
    driver: bridge
