name: Build and Deploy with Docker Compose

on:
  push:
    branches: [compose, main]
  pull_request:
    branches: [compose, main]

env:
  DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
  DOCKER_HUB_PASSWORD: ${{ secrets.DOCKER_HUB_PASSWORD }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}

      - name: Build and push Backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ secrets.DOCKER_HUB_USERNAME }}/shopping-list-backend:${{ github.sha }}
            ${{ secrets.DOCKER_HUB_USERNAME }}/shopping-list-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL || 'https://shopping.botpast.com/api' }}
          tags: |
            ${{ secrets.DOCKER_HUB_USERNAME }}/shopping-list-frontend:${{ github.sha }}
            ${{ secrets.DOCKER_HUB_USERNAME }}/shopping-list-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/compose'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create .env file
        run: |
          cat > .env << EOF
          DOCKER_HUB_USERNAME=${{ secrets.DOCKER_HUB_USERNAME }}
          MONGODB_ROOT_PASSWORD=${{ secrets.MONGODB_ROOT_PASSWORD }}
          JWT_SECRET_KEY=${{ secrets.JWT_SECRET_KEY }}
          JWT_ALGORITHM=${{ secrets.JWT_ALGORITHM || 'HS256' }}
          ACCESS_TOKEN_EXPIRE_MINUTES=${{ secrets.ACCESS_TOKEN_EXPIRE_MINUTES || '1440' }}
          ADMIN_USERNAME=${{ secrets.ADMIN_USERNAME }}
          ADMIN_PASSWORD=${{ secrets.ADMIN_PASSWORD }}
          S3_BUCKET=${{ secrets.S3_BUCKET || 'shopping-list-backup' }}
          NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL || 'https://shopping.botpast.com/api' }}
          IMAGE_TAG=${{ github.sha }}
          EOF

      - name: Copy files to server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          source: "docker-compose.prod.yml,.env"
          target: "/opt/shopping-list"

      - name: Deploy to server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            cd /opt/shopping-list

            # Login to Docker Hub
            echo "${{ secrets.DOCKER_HUB_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_HUB_USERNAME }}" --password-stdin

            # Pull latest images
            docker pull ${{ secrets.DOCKER_HUB_USERNAME }}/shopping-list-backend:${{ github.sha }}
            docker pull ${{ secrets.DOCKER_HUB_USERNAME }}/shopping-list-frontend:${{ github.sha }}

            # Stop and remove old containers
            docker-compose -f docker-compose.prod.yml down

            # Start new containers
            docker-compose -f docker-compose.prod.yml up -d

            # Clean up old images
            docker image prune -af --filter "until=24h"

            # Wait for services to be healthy
            echo "Waiting for services to be ready..."
            sleep 30

            # Check service status
            docker-compose -f docker-compose.prod.yml ps

      - name: Verify deployment
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            cd /opt/shopping-list

            # Test backend health
            curl -f http://localhost:8185/health || echo "Backend health check failed"

            # Test frontend
            curl -f http://localhost:3135 || echo "Frontend health check failed"

            # Show running containers
            docker-compose -f docker-compose.prod.yml ps

      - name: Deployment Summary
        run: |
          echo "## 🚀 Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Images built and pushed to Docker Hub:" >> $GITHUB_STEP_SUMMARY
          echo "- Backend: \`${{ secrets.DOCKER_HUB_USERNAME }}/shopping-list-backend:${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Frontend: \`${{ secrets.DOCKER_HUB_USERNAME }}/shopping-list-frontend:${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Deployed to server using Docker Compose" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📱 **Frontend**: http://${{ secrets.SERVER_HOST }}:3135" >> $GITHUB_STEP_SUMMARY
          echo "🔧 **Backend API**: http://${{ secrets.SERVER_HOST }}:8185" >> $GITHUB_STEP_SUMMARY

      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `🚀 Deployment completed successfully!

            📦 **Docker Images**:
            - Backend: \`${{ secrets.DOCKER_HUB_USERNAME }}/shopping-list-backend:${{ github.sha }}\`
            - Frontend: \`${{ secrets.DOCKER_HUB_USERNAME }}/shopping-list-frontend:${{ github.sha }}\`

            📱 **Frontend URL**: http://${{ secrets.SERVER_HOST }}:3135
            🔧 **Backend API**: http://${{ secrets.SERVER_HOST }}:8185

            The application has been deployed to the server using Docker Compose and is ready for testing.`
            })
