services:
  mongodb:
    image: mongo:7
    container_name: shopping-list-mongodb
    ports:
      - "27888:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=${MONGODB_ROOT_PASSWORD:-dev_password_change_me}
      - MONGO_INITDB_DATABASE=shopping_list_auth
    networks:
      - shopping-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8185:8185"
    volumes:
      - ./backend:/app
      - shopping_data:/app/data
    environment:
      - S3_BUCKET=${S3_BUCKET:-shopping-list-backup}
      - MONGODB_URL=mongodb://admin:${MONGODB_ROOT_PASSWORD:-dev_password_change_me}@mongodb:27017/shopping_list_auth?authSource=admin
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-dev_secret_change_me}
      - JWT_ALGORITHM=${JWT_ALGORITHM:-HS256}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-1440}
      - PORT=8185
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin123}
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - shopping-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8185/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3135:3135"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8185
      - BACKEND_URL=http://backend:8185
      - PORT=3135
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - shopping-network
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:3135",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  shopping_data:
    driver: local
  mongo_data:
    driver: local

networks:
  shopping-network:
    driver: bridge
